<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="style.css">
    <title>Welcome to 123Haiku's Website</title>
</head>
<body>
    <h1>Explore the features of website</h1>
    <a href="jsmol.html" style="color: #60a5fa; text-decoration: none;">➜ JSmol 3D Molecular Viewer</a><br>

    <!-- Video Downloader Section -->
    <div style="margin-top: 40px; padding: 24px; background: #25252b; border-radius: 8px; display: inline-block; box-shadow: 0 4px 16px rgba(0,0,0,0.4); max-width: 520px; width: 100%; text-align: left; box-sizing: border-box;">
        <h3 style="margin-top: 0; color: #f0f0f0;">Online Video Downloader</h3>

        <div style="display: flex; gap: 8px;">
            <input type="text" id="video-url-input" placeholder="Paste YouTube / Instagram / video URL..."
                style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #18181b; color: #fff; outline: none;" />
            <button id="dl-btn" onclick="triggerDownload()"
                style="padding: 10px 18px; font-weight: bold; border: none; border-radius: 6px; background: #16a34a; color: white; cursor: pointer;">
                Download
            </button>
        </div>

        <div id="progress-container" style="display: none; margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; font-size: 13px; color: #a1a1aa; margin-bottom: 4px;">
                <span id="progress-text">Downloading: 0%</span>
                <span id="progress-meta">Speed: -- | ETA: --</span>
            </div>
            <div style="width: 100%; height: 8px; background: #33333d; border-radius: 4px; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: #22c55e; transition: width 0.3s ease;"></div>
            </div>
        </div>
        <p id="dl-status" style="margin-top: 10px; font-size: 14px; color: #a1a1aa;"></p>

        <hr style="border: 0; border-top: 1px solid #383842; margin: 18px 0;" />

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h4 style="margin: 0; color: #e4e4e7;">Completed Downloads</h4>
            <button onclick="fetchCompletedVideos()"
                style="background: none; border: 1px solid #555; color: #a1a1aa; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px;">Refresh</button>
        </div>

        <p id="list-hint" style="margin: 8px 0 0; font-size: 12px; color: #71717a;"></p>
        <ul id="video-list" style="list-style: none; padding: 0; margin-top: 12px; max-height: 220px; overflow-y: auto;">
            <li style="color: #71717a; font-size: 13px;">Loading completed files...</li>
        </ul>

        <!-- Raspberry Pi Stats Panel -->
        <hr style="border: 0; border-top: 1px solid #383842; margin: 18px 0;" />
        <div style="font-size: 13px; color: #a1a1aa;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <strong style="color: #e4e4e7;">Raspberry Pi Health</strong>
                <span id="pi-online-status" style="color: #ef4444;">● Offline</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div>CPU Temp: <span id="stat-temp" style="color: #fff;">--</span></div>
                <div>CPU Usage: <span id="stat-cpu" style="color: #fff;">--</span></div>
                <div>RAM: <span id="stat-ram" style="color: #fff;">--</span></div>
                <div>Disk Free: <span id="stat-disk" style="color: #fff;">--</span></div>
                <div>Your quota: <span id="stat-quota" style="color: #fff;">--</span></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.ngc6543.tech";

        // Public site: there is no key anywhere in this page.
        // All gating lives on the Pi: per-IP token bucket, per-IP daily
        // download quota, global concurrency cap, disk watermark.
        // The browser only does two things: reject URLs that are obviously
        // not video sites (fewer pointless requests reach the server), and
        // translate 429/503 into one readable sentence.
        const ALLOWED_HOSTS = [
            "youtube.com", "youtu.be",
            "instagram.com",
            "tiktok.com",
            "facebook.com", "fb.watch",
            "x.com", "twitter.com",
            "vimeo.com", "dailymotion.com", "twitch.tv",
            "reddit.com", "soundcloud.com", "bilibili.com",
        ];

        // Same rule as the server, applied earlier to catch typos and pastes.
        function isAllowedHost(rawUrl) {
            let u;
            try { u = new URL(rawUrl); } catch { return false; }
            if (u.protocol !== "http:" && u.protocol !== "https:") return false;
            // Refuse bare IP literals: 127.0.0.1 / 192.168.x / 169.254.x
            if (/^\d{1,3}(\.\d{1,3}){3}$/.test(u.hostname)) return false;
            if (u.hostname.startsWith("[") || u.hostname.includes(":")) return false;
            const h = u.hostname.toLowerCase().replace(/\.$/, "");
            return ALLOWED_HOSTS.some(s => h === s || h.endsWith("." + s));
        }

        // One human sentence for every non-2xx path.
        function explainStatus(res, data) {
            if (res.status === 429) {
                const ra = res.headers.get("Retry-After");
                return "Busy right now - " + (data && data.detail ? data.detail : "try again in a bit")
                     + (ra ? ` (retry in ${ra}s)` : "");
            }
            if (res.status === 503) return (data && data.detail) || "Server is out of space, try later.";
            if (res.status === 401) return "This endpoint is locked. The public site should never need a key.";
            if (res.status === 400) return (data && data.detail) ? String(data.detail) : "Request rejected.";
            return (data && (data.detail || data.message)) || ("HTTP " + res.status);
        }

        function createVideoListItem(v) {
            const li = document.createElement("li");
            li.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #33333d;";

            const infoDiv = document.createElement("div");
            infoDiv.style.cssText = "overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px;";
            infoDiv.title = v.filename;

            const nameSpan = document.createElement("span");
            nameSpan.style.cssText = "color: #e4e4e7; font-size: 14px;";
            nameSpan.textContent = v.filename;

            const sizeSpan = document.createElement("span");
            sizeSpan.style.cssText = "color: #71717a; font-size: 12px;";
            const age = (typeof v.age_min === "number")
                ? (v.age_min < 60 ? `${v.age_min} min ago` : `${Math.round(v.age_min / 60)} h ago`)
                : "";
            sizeSpan.textContent = `${v.size_mb} MB${age ? " - " + age : ""} - auto-deletes`;

            infoDiv.appendChild(nameSpan);
            infoDiv.appendChild(document.createElement("br"));
            infoDiv.appendChild(sizeSpan);

            const saveBtn = document.createElement("button");
            saveBtn.textContent = "Save";
            saveBtn.style.cssText = "background: #2563eb; color: #fff; padding: 6px 12px; border-radius: 4px; border: none; font-size: 12px; font-weight: bold; cursor: pointer;";
            // Top-level navigation: the browser handles Content-Disposition
            // itself, so no fetch, no CORS, no redirect that fetch could eat.
            saveBtn.addEventListener("click", () => {
                window.location.href = v.download_url.startsWith("http")
                    ? v.download_url
                    : API_BASE + v.download_url;
            });

            li.appendChild(infoDiv);
            li.appendChild(saveBtn);
            return li;
        }

        async function fetchCompletedVideos() {
            const listEl = document.getElementById("video-list");
            const hintEl = document.getElementById("list-hint");
            try {
                const res = await fetch(`${API_BASE}/api/videos?t=${Date.now()}`, { cache: "no-store" });

                if (!res.ok) {
                    listEl.innerHTML = `<li style="color: #ef4444; font-size: 13px;">${explainStatus(res, {})}</li>`;
                    return;
                }

                const data = await res.json();
                listEl.innerHTML = "";

                if (hintEl && typeof data.ttl_hours === "number") {
                    hintEl.textContent = `Files are removed automatically after ${data.ttl_hours} h.`;
                }

                if (!data.videos || data.videos.length === 0) {
                    listEl.innerHTML = `<li style="color: #71717a; font-size: 13px;">No files on the Pi right now. Paste a link above.</li>`;
                    return;
                }

                data.videos.forEach(v => listEl.appendChild(createVideoListItem(v)));
            } catch (err) {
                listEl.innerHTML = `<li style="color: #ef4444; font-size: 13px;">Failed to reach the Pi. It may be offline.</li>`;
            }
        }

        async function pollProgress(taskId) {
            const container = document.getElementById("progress-container");
            const bar = document.getElementById("progress-bar");
            const text = document.getElementById("progress-text");
            const meta = document.getElementById("progress-meta");
            const status = document.getElementById("dl-status");

            container.style.display = "block";
            let misses = 0;

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/progress/${taskId}`, { cache: "no-store" });

                    if (res.status === 429) {
                        // Read limiter: back off to one poll every 3s, no abort.
                        meta.innerText = "throttled, slowing down...";
                        return;
                    }
                    if (!res.ok) {
                        if (++misses > 20) {
                            clearInterval(interval);
                            status.innerText = "Lost track of this task. Check the list below.";
                            status.style.color = "#f87171";
                        }
                        return;
                    }
                    misses = 0;

                    const data = await res.json();

                    if (data.status === "downloading") {
                        bar.style.width = `${data.percent}%`;
                        text.innerText = `Downloading: ${data.percent}%`;
                        meta.innerText = `${data.speed} | ETA: ${data.eta}`;
                    } else if (data.status === "processing") {
                        bar.style.width = "100%";
                        text.innerText = "Processing and muxing audio/video...";
                        meta.innerText = "Almost done";
                    } else if (data.status === "completed") {
                        clearInterval(interval);
                        bar.style.width = "100%";
                        text.innerText = "Finished!";
                        meta.innerText = "";
                        status.innerText = "Ready - click Save on it below.";
                        status.style.color = "#4ade80";
                        fetchCompletedVideos();
                    } else if (data.status === "error") {
                        clearInterval(interval);
                        status.innerText = "Download failed: " + (data.error || "unknown reason");
                        status.style.color = "#ef4444";
                    }
                } catch (e) {
                    if (++misses > 20) clearInterval(interval);
                }
            }, 1000);
        }

        async function triggerDownload() {
            const input = document.getElementById("video-url-input");
            const status = document.getElementById("dl-status");
            const btn = document.getElementById("dl-btn");
            const url = input.value.trim();

            if (!url) {
                status.innerText = "Please paste a video URL first.";
                status.style.color = "#f87171";
                return;
            }

            if (!isAllowedHost(url)) {
                status.innerText = "Supported: YouTube / Instagram / TikTok / Facebook / X / Vimeo / Reddit / SoundCloud / Bilibili.";
                status.style.color = "#f87171";
                return;
            }

            btn.disabled = true;
            btn.style.opacity = "0.6";
            status.innerText = "Submitting...";
            status.style.color = "#a1a1aa";

            try {
                const res = await fetch(`${API_BASE}/api/download`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });

                const data = await res.json().catch(() => ({}));
                if (res.ok && data.task_id) {
                    input.value = "";
                    if (typeof data.quota_left === "number") {
                        status.innerText = `Queued. You have ${data.quota_left} download(s) left today.`;
                        status.style.color = "#a1a1aa";
                    }
                    pollProgress(data.task_id);
                } else {
                    status.innerText = explainStatus(res, data);
                    status.style.color = "#f87171";
                }
            } catch (err) {
                status.innerText = "Connection failed. Ensure the Pi is online.";
                status.style.color = "#f87171";
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        async function fetchPiStats() {
            const statusEl = document.getElementById("pi-online-status");
            const tempEl = document.getElementById("stat-temp");
            const cpuEl = document.getElementById("stat-cpu");
            const ramEl = document.getElementById("stat-ram");
            const diskEl = document.getElementById("stat-disk");
            const quotaEl = document.getElementById("stat-quota");

            try {
                const res = await fetch(`${API_BASE}/api/stats`, { cache: "no-store" });
                if (!res.ok) throw new Error("stats rejected");

                const data = await res.json();
                statusEl.innerText = "● Online";
                statusEl.style.color = "#22c55e";

                tempEl.innerText = data.cpu_temp_c ? `${data.cpu_temp_c}°C` : "N/A";
                cpuEl.innerText = `${data.cpu_usage_pct ?? "--"}%`;
                ramEl.innerText = `${data.ram_used_mb}MB / ${data.ram_total_mb}MB (${data.ram_pct}%)`;
                diskEl.innerText = `${data.disk_free_gb}GB free / ${data.disk_total_gb}GB`;

                if (quotaEl && data.your_quota) {
                    quotaEl.innerText =
                        `${data.your_quota.downloads_left_today} / ${data.your_quota.downloads_per_day} left today`;
                }
            } catch (err) {
                statusEl.innerText = "● Offline";
                statusEl.style.color = "#ef4444";
            }
        }

        // Initialize UI
        fetchCompletedVideos();
        fetchPiStats();
        setInterval(fetchPiStats, 10000);
        setInterval(fetchCompletedVideos, 30000);
    </script>
</body>
</html>
